name: CI Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  merge-and-freshness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if branch is up to date with main
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || (echo "Branch is not up to date with main. Please rebase or merge main first." && exit 1)

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint check
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      # Automated tests will be enabled in Phase 2 once feature test suites are introduced
      # - name: Run tests
      #   run: pnpm test:run
      - name: Build Next.js application
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://example.com
          NEXT_PUBLIC_LIFF_ID: placeholder_liff_id
